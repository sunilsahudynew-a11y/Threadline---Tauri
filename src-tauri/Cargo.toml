[package]
name = "threadline"
version = "0.1.0"
description = "Threadline - Narrative Studio & Novelist Workspace"
authors = ["Threadline Studio"]
edition = "2021"

[lib]
name = "threadline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
